version: "3.9"

networks:
  openote-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openote
      POSTGRES_USER: openote
      POSTGRES_PASSWORD: openote
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - openote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openote -d openote"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - openote-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: ../infra/docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://openote:openote@postgres:5432/openote?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: changeme-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openote-net

  worker:
    build:
      context: ./worker
      dockerfile: ../infra/docker/worker.Dockerfile
    environment:
      DB_DSN: postgres://openote:openote@postgres:5432/openote?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: changeme-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - openote-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - openote-net

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: ../docker/nginx.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    networks:
      - openote-net
